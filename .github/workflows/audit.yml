name: Dependency audit
# A separate workflow on purpose: a new advisory must not stop CI (and so every deploy) on an unrelated change. It runs
# weekly and on pull requests that touch the lockfile, and shows up as its own check.
on:
  schedule:
    - cron: "0 5 * * 1"
  pull_request:
    paths: [package-lock.json, "**/package.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      # The full report, for reading. (npm cannot tell wrangler, the build and local-dev CLI, from runtime code in this
      # workspace layout, so a high advisory in its emulator, such as sharp in miniflare on 6 October 2026, shows here.)
      - run: npm audit --omit=dev || true
      # The check that fails: critical advisories only. High ones need a human to judge whether the code ships.
      - run: npm audit --omit=dev --audit-level=critical
