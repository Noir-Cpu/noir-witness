name: Dependency audit
# A separate workflow on purpose: a new advisory must not stop CI (and so every deploy) on an unrelated change. It runs
# weekly and on pull requests that touch the lockfile, and shows up as its own check.
on:
  schedule:
    - cron: "0 5 * * 1"
  pull_request:
    paths: [package-lock.json, "**/package.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      # Everything that ships to a browser or runs in the Worker. Dev-only advisories are listed by `npm audit` locally.
      - run: npm audit --omit=dev --audit-level=high
